name: Test cancel action basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REPOSITORY: test-owner/test-repo
      GITHUB_RUN_ID: "12345"
      GITHUB_JOB: test-job
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run cancel action (expected to fail with API error in local env)
        id: cancel
        uses: .
        with:
          token: fake-token-for-testing
        continue-on-error: true

      - name: Assert action ran and produced expected output
        env:
          OUTCOME: ${{ steps.cancel.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should either succeed or fail with an API error
          # In a local act environment without real GitHub API, it will fail
          # We just verify it ran (outcome is not empty/skipped)
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME"

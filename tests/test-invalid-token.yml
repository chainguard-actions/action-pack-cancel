name: Test invalid token - action should fail with auth error
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action POSTs to the GitHub API with an invalid token.
      # The API should return 401 Unauthorized, causing the action to exit 1.
      - id: cancel
        uses: .
        continue-on-error: true
        with:
          token: invalid-token-value

      - name: Assert action failed due to invalid token
        env:
          OUTCOME: ${{ steps.cancel.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected 'failure' outcome with invalid token, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid token"

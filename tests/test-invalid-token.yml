name: Test cancel workflow with invalid token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run cancel action with invalid token
        id: action
        uses: .
        with:
          token: invalid-token-that-will-fail
        # An invalid token causes the GitHub API to return a non-202 response
        # (401 Bad credentials). The action logs the error and exits 1.
        continue-on-error: true
      - name: Assert action failed with invalid token
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid token, got: ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid token"

name: Test cancel action with default token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REPOSITORY: test-owner/test-repo
      GITHUB_RUN_ID: "99999"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: cancel
        uses: .
        # No token provided — action uses default ${{ github.token }}
        continue-on-error: true

      - name: Assert action ran (expected to fail without real GitHub API)
        env:
          OUTCOME: ${{ steps.cancel.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # In act there is no real GitHub API, so the action will fail.
          # We confirm it ran and produced a failure (not an unexpected skip/error).
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected outcome 'failure' but got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action ran with default token and failed as expected (no real GitHub API in act)"

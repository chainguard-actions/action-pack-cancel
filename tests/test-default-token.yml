name: Test cancel action with default token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify node action entrypoint exists
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/index.js" ]; then
            echo "FAIL: index.js not found"
            exit 1
          fi
          echo "PASS: index.js found"
          node --version
      - id: cancel
        name: Run cancel action with default token
        uses: .
        continue-on-error: true
      - name: Assert action ran with default token
        env:
          OUTCOME: ${{ steps.cancel.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # In act, github.token is a mock value; the action will attempt
          # to call the GitHub API and fail with an auth/API error.
          # We verify the action ran (not a missing file or syntax error).
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and produced an outcome"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
